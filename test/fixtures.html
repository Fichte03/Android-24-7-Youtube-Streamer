<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>MultiStream Test Page</title>
  <style>body{margin:0;background:#111;color:#eee;font-family:sans-serif}</style>
</head>
<body>
  <h3 style="padding:8px">Test-Fixtures</h3>
  <div id="fixtures"></div>
  <script>
    // Erzeugt deterministische, abspielbare WebM-Videos via MediaRecorder + Canvas.
    // Jedes Video hat eine eigene Farbe/Nummer und läuft ~6 Sekunden.
    async function makeVideo(seed) {
      const canvas = document.createElement("canvas");
      canvas.width = 320; canvas.height = 180;
      const ctx = canvas.getContext("2d");
      const stream = canvas.captureStream(15);
      const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
        ? "video/webm;codecs=vp9" : "video/webm";
      const rec = new MediaRecorder(stream, { mimeType: mime });
      const chunks = [];
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      const done = new Promise((res) => (rec.onstop = res));
      rec.start();

      await new Promise((resolve) => {
        let t = 0;
        const hue = (seed * 47) % 360;
        function draw() {
          ctx.fillStyle = `hsl(${hue},70%,${25 + (t % 40)})`;
          ctx.fillRect(0, 0, 320, 180);
          ctx.fillStyle = "#fff";
          ctx.font = "bold 64px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("V" + seed, 160, 90 + Math.sin(t / 5 + seed) * 30);
          t++;
          if (t >= 90) resolve(); // ~6s bei 15fps
          else requestAnimationFrame(draw);
        }
        draw();
      });

      rec.stop();
      await done;
      return URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    }

    (async () => {
      const urls = [];
      for (let i = 1; i <= 6; i++) urls.push(await makeVideo(i));
      window.__fixtureUrls = urls;
      const el = document.getElementById("fixtures");
      el.textContent = "FIXTURES_READY:" + urls.length;
    })();
  </script>
</body>
</html>
